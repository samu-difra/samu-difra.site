<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il mio spazio personale</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .contenitore {
      max-width: 650px;
      margin: 20px;
      padding: 50px 30px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #333;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 24px;
      color: white;
      background: #2563eb;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <main class="contenitore">
    <h1>Benvenuto nel mio spazio personale</h1>

    <p>
      Questo è il mio sito personale, dove puoi trovare alcune informazioni su di me.
    </p>

    <p>
      Per approfondire, puoi visitare il sito principale indicato qui sotto.
    </p>

    <a href="https://www.example.com" target="_blank" rel="noopener noreferrer">
      Visita il sito principale →
    </a>
  </main>
</body>
</html>
